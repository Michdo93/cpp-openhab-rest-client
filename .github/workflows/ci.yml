name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev nlohmann-json3-dev cmake build-essential valgrind
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Install and use with find_package (same target names as FetchContent)
        run: |
          cmake --install build --prefix $PWD/pkg
          cmake -S test/consumer -B build-consumer -DCMAKE_PREFIX_PATH=$PWD/pkg
          cmake --build build-consumer -j2
          ./build-consumer/consumer_static
          LD_LIBRARY_PATH=$PWD/pkg/lib ./build-consumer/consumer_shared
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: openHAB for the integration tests
        run: bash .github/openhab/start.sh
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: openHAB log
        if: failure()
        run: tail -n 100 ~/openhab/openhab.out ~/openhab/userdata/logs/openhab.log || true
      - name: Memory check
        run: valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=1 build/openhab_integration_test
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cmake --install build --prefix pkg
          tar czf cpp-openhab-rest-client-${GITHUB_REF_NAME}-linux-x86_64.tar.gz -C pkg .
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cpp-openhab-rest-client-*-linux-x86_64.tar.gz

  fetchcontent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Without installed nlohmann/json (downloaded by CMake)
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev cmake build-essential
          cmake -S . -B build && cmake --build build -j2 && ctest --test-dir build -R "unit|cpp20" --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install nlohmann-json
      - run: cmake -S . -B build && cmake --build build -j3 && ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with vcpkg
        shell: pwsh
        run: |
          vcpkg install curl nlohmann-json --triplet x64-windows
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release
